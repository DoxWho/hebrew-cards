  <style>
    /* Critical above-fold CSS to prevent FOUC */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f1f5f9; }
    #root { height: 100%; }
    body {
      font-family: 'Noto Sans Hebrew', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      /* Safe area insets for iPhone notch / Dynamic Island */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Tailwind bundle — Vite will replace this -->
  <script type="module" src="./src/main.jsx"></script>

  <!-- ══════════════════════════════════════════════════════════
       Service Worker Registration
       - Must be registered from the page scope root
       - Uses relative path for GitHub Pages subdirectory support
  ══════════════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(function (registration) {
            console.log('[App] Service Worker registered. Scope:', registration.scope);

            // Listen for updates and prompt user to refresh
            registration.addEventListener('updatefound', function () {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // A new version is available; could show a toast here
                  console.log('[App] New version available. Reload to update.');
                }
              });
            });
          })
          .catch(function (error) {
            console.error('[App] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
